# tenshu override for [menu].
# NOTE: a section override REPLACES the whole section, so every key the
# generated shell.toml had is restated here. Hex values are copied from
# colors.toml -- if the palette changes, re-sync this file.

# Cards, rows, and selected-row treatment. Alpha companions (where present)
# go from 0 (invisible) to 1 (opaque). scrim is the full-screen dim layer
# behind the card. Clipboard and emojis inherit these tokens.
background                = "#101a16"
background-alpha          = 1.0
text                      = "#b4bfae"
border                    = "#b4bfae"
border-alpha              = 0.25
scrim                     = "#101a16"
scrim-alpha               = 0.5
selected-background       = "#b4bfae"
selected-background-alpha = 0.08
selected-text             = "#acd095"
selected-border           = "#acd095"
selected-border-alpha     = 0.50
